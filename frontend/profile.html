<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — TaskFlow</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>

  <div class="main-area">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="profile-card">
        <div class="profile-header">
          <div class="profile-avatar" id="profileAvatar">--</div>
          <div>
            <h2 id="profileName">—</h2>
            <p style="color:var(--ink-muted); font-size:14px;" id="profileEmail">—</p>
          </div>
        </div>

        <div class="profile-stats">
          <div><strong id="profileProjectCount">0</strong><span>Projects</span></div>
          <div><strong id="profileTaskCount">0</strong><span>Tasks Assigned</span></div>
        </div>

        <form id="profileForm">
          <div class="field">
            <label for="editName">Full name</label>
            <input type="text" id="editName" required />
          </div>
          <div class="field">
            <label for="editEmail">Email</label>
            <input type="email" id="editEmail" required />
          </div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>
    </main>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
