<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — TaskFlow</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>

  <div class="main-area">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-icon icon-indigo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
          </div>
          <div class="stat-value" id="statProjects">0</div>
          <div class="stat-label">Total Projects</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon icon-teal">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          </div>
          <div class="stat-value" id="statTasks">0</div>
          <div class="stat-label">Total Tasks</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon icon-amber">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div class="stat-value" id="statPending">0</div>
          <div class="stat-label">Pending Tasks</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon icon-coral">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <div class="stat-value" id="statCompleted">0</div>
          <div class="stat-label">Completed Tasks</div>
        </div>
      </div>

      <div class="two-col">
        <div class="panel">
          <div class="section-heading">
            <h3>Recent Projects</h3>
            <a class="view-all" href="projects.html">View all →</a>
          </div>
          <div id="recentProjects"></div>
        </div>

        <div class="panel">
          <div class="section-heading">
            <h3>Recent Tasks</h3>
          </div>
          <div id="recentTasks"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
